<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Thoughs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine" aria-labelledby="title">
    <h1 id="title">DEEP THOUGHS</h1>

      <span id="lamp" class="lamp"></span>

    <section class="report" aria-labelledby="reportTitle">
      <h2 id="reportTitle">Vocabulary report</h2>
      <pre id="reportText">Nothing loaded yet.</pre>
    </section>
  </main>

  <script src="program.js"></script>
</body>
</html>
