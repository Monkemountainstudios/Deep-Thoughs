<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Thoughs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine" aria-labelledby="title">
    <h1 id="title">DEEP THOUGHS</h1>
    <p class="subtitle">Generative Poetry Engine v0.3</p>

    <div class="status" aria-live="polite">
      <span id="lamp" class="lamp"></span>
      <span id="statusText">READING THE ARCHIVE</span>
    </div>

    <button id="thoughtButton" type="button" disabled>PLEASE WAIT</button>

    <section class="thought-panel" aria-live="polite">
      <p id="thoughtText">The machine is gathering words.</p>
    </section>

    <details class="report">
      <summary>Vocabulary report</summary>
      <pre id="reportText">Loading...</pre>
    </details>
  </main>

  <script src="program.js"></script>
</body>
</html>
