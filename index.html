<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Thoughts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine" aria-labelledby="title">
    <h1 id="title">DEEP THOUGHTS</h1>
    <p class="subtitle">Generative Poetry Engine v1.3</p>

    <div class="status" aria-live="polite">
      <span id="lamp" class="lamp"></span>
      <span id="statusText">READING THE ARCHIVE</span>
    </div>

    <div class="controls">
      <button id="thoughtButton" type="button" disabled>PLEASE WAIT</button>
      <button id="ccButton" type="button" disabled aria-pressed="true">CC: ON</button>
    </div>

    <section class="thought-panel" aria-label="Live transcript">
      <div id="transcript" class="transcript" aria-live="polite">
        <p class="transcript-placeholder">The machine is gathering words.</p>
      </div>
    </section>

    <details class="report">
      <summary>Vocabulary report</summary>
      <pre id="reportText">Loading...</pre>
    </details>
  </main>

  <script src="program.js?V1.3"></script>
</body>
</html>
